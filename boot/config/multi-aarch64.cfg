# TerrariumOS menu boot for AArch64 systems.
mode=multi
timeout_ms=5000
default=0

[entry]
name=TerrariumOS
arch=aarch64
protocol=efi-stub
kernel=/boot/aarch64/terrarium-kernel.efi
initrd=/boot/initrd.img
cmdline=root=auto devicetree=auto

[entry]
name=Alternate ARM64 Kernel
arch=aarch64
protocol=efi-stub
kernel=/boot/other/arm64-kernel.efi
cmdline=root=/dev/mmcblk0p2
