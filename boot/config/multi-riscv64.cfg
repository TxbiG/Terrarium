# TerrariumOS menu boot for RISC-V 64 systems.
mode=multi
timeout_ms=5000
default=0

[entry]
name=TerrariumOS
arch=riscv64
protocol=devicetree
kernel=/boot/riscv64/terrarium-kernel.bin
initrd=/boot/initrd.img
cmdline=root=auto devicetree=auto

[entry]
name=Alternate RISC-V Kernel
arch=riscv64
protocol=devicetree
kernel=/boot/other/riscv64-kernel.bin
cmdline=root=/dev/vda2
