# TerrariumOS menu boot for x86_64 PCs.
# This is intentionally GRUB-like in behavior, not GRUB syntax or code.
mode=multi
timeout_ms=5000
default=0

[entry]
name=TerrariumOS
arch=x86_64
protocol=terrarium
kernel=/boot/x86_64/terrarium-kernel.bin
initrd=/boot/initrd.img
cmdline=root=auto console=tty0

[entry]
name=Multiboot2 Kernel
arch=x86_64
protocol=multiboot2
kernel=/boot/other/kernel.elf
cmdline=root=/dev/sda1

[entry]
name=Multiboot1 Kernel
arch=x86
protocol=multiboot1
kernel=/boot/legacy/kernel.elf
cmdline=root=/dev/sda1
